# Environment 2b
# This environment features two obstacles symmetrically placed with respect to those of 
# env 2

# environment properties
env:
    name: "Env 2b"
    dimension: 2
    origin: [0.0, 0.0]
    size: [10.0, 10.0]

# obstacles properties
obstacles: 
    vertices: [
        [[6.0, 2.0], [8.0, 2.0], [8.0, 4.0], [6.0, 4.0]],
        [[2.0, 6.0], [4.0, 6.0], [4.0, 8.0], [2.0, 8.0]]
    ]

# generators properties
generators:
    vertices: [
        [[7.0, 4.0], [7.0, 10.0]],
        [[3.0, 8.0], [3.0, 10.0]]
    ]  

goal:
    vertices: []
    
# robot properties
robot:
    anchor_point: [5.0, 5.0]
    initial_state: [5.0, 5.0]
    radius: 0.0

# tether properties
tether:
    max_length: 10.0
    initial_state: [
        [5.0, 5.0], [5.0, 5.0]
    ]